<!DOCTYPE html>
<html lang="en">
<head>
<script src="nav.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Cards</title>

<link rel="stylesheet" href="app.css">
<script defer src="app.js"></script>

<style>
:root{
  --blue:#6f9faa;
  --bg:#f2f2f2;
  --red:#cf3e3e;
  --text:#111;
  --muted:#777;
  --border:#e5e5ea;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
}

.header{
  background:var(--blue);
  color:#fff;
  padding:20px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-title{font-size:20px;font-weight:800;}
.header img{width:50px;}

.main{padding:20px;padding-bottom:40px;}

.hero-card{
  background:#fff;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  margin-bottom:20px;
}

.hero-card img{width:100%;display:block;}
.hero-body{padding:20px;}
.hero-title{font-size:24px;font-weight:800;}
.hero-desc{margin-top:10px;color:var(--muted);line-height:1.5;}

.amounts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:20px;
}

.amount{
  background:#fff;
  border-radius:999px;
  padding:15px;
  text-align:center;
  font-weight:800;
  border:2px solid transparent;
  cursor:pointer;
  font-size:18px;
}

.amount.active{
  border:2px solid var(--red);
  color:var(--red);
}

.custom{
  margin-top:12px;
  background:#fff;
  padding:18px;
  border-radius:999px;
  text-align:center;
  font-weight:700;
  color:var(--muted);
}

.footer{margin:30px 20px 120px;}

.cta{
  background:var(--red);
  color:#fff;
  padding:20px;
  border-radius:999px;
  text-align:center;
  font-weight:800;
  cursor:pointer;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:80px;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.nav-item.active{color:var(--blue);font-weight:600;}
.icon{font-size:20px;margin-bottom:4px;}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

.modal-box{
  background:#fff;
  padding:20px;
  border-radius:16px;
  width:80%;
  max-width:320px;
  text-align:center;
}

.modal-box img{width:70px;margin-bottom:10px;}

.modal-title{font-size:18px;font-weight:700;}
.modal-text{font-size:14px;color:var(--muted);margin:8px 0 14px;}

.modal-input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px;
}

.modal-actions{display:flex;gap:8px;margin-top:14px;}

.modal-btn{
  flex:1;
  padding:12px;
  border-radius:999px;
  font-weight:600;
  cursor:pointer;
}

.modal-btn.allow{background:var(--red);color:#fff;}
.modal-btn.deny{border:1px solid var(--border);background:#fff;color:var(--text);}

.nav-img{
  width:26px;
  height:26px;
  object-fit:contain;
  margin-bottom:4px;
}

</style>

</head>

<body>

<div class="header">
  <div class="header-title">GIFT CARDS</div>
  <img src="PropChkn2.png">
</div>

<div class="main">

  <div class="hero-card">
    <img src="PropChkn3.png">
    <div class="hero-body">
      <div class="hero-title">Send a Gift Card</div>
      <div class="hero-desc">
        Perfect for friends, family, or anyone who loves great chicken.
      </div>
    </div>
  </div>

  <div class="hero-card" style="margin-top:12px;">
    <div class="hero-body">
      <div class="hero-title">Use a Gift Card</div>
      <div class="hero-desc">
        Add a gift card to your account or apply it at checkout.
      </div>

      <div style="margin-top:16px;">
        <div class="cta" onclick="openGiftModal()">ADD GIFT CARD</div>
      </div>
    </div>
  </div>

  <div class="amounts">
    <div class="amount active" onclick="selectAmount(this)">$10</div>
    <div class="amount" onclick="selectAmount(this)">$25</div>
    <div class="amount" onclick="selectAmount(this)">$50</div>
    <div class="amount" onclick="selectAmount(this)">$100</div>
  </div>

  <div class="custom">$ Custom Amount</div>

  <div class="footer">
    <div class="cta" onclick="navigate('gift-checkout.html')">CONTINUE</div>
  </div>

</div>

<div id="giftModal" class="modal">
  <div class="modal-box">
    <img src="PropChkn1.png">
    <div class="modal-title">Add Gift Card</div>
    <div class="modal-text">Enter your card details below</div>
    <input id="cardNumber" placeholder="Card Number" class="modal-input">
    <input id="cardPin" placeholder="PIN" class="modal-input" type="password">
    <div class="modal-actions">
      <div class="modal-btn deny" onclick="closeGiftModal()">Cancel</div>
      <div class="modal-btn allow" onclick="applyGiftCard()">Apply</div>
    </div>
  </div>
</div>

<script>
localStorage.setItem('giftAmount', document.querySelector('.amount.active').innerText);

function selectAmount(el){
  document.querySelectorAll('.amount').forEach(a=>a.classList.remove('active'));
  el.classList.add('active');
  localStorage.setItem('giftAmount', el.innerText);
}

function openGiftModal(){
  document.getElementById('giftModal').style.display='flex';
}

function closeGiftModal(){
  document.getElementById('giftModal').style.display='none';
}

function applyGiftCard(){
  const number=document.getElementById('cardNumber').value.trim();
  const pin=document.getElementById('cardPin').value.trim();
  if(!number||!pin){return;}
  localStorage.setItem('giftCard', number);
  closeGiftModal();
}

function navigate(page){
  if(window.showLoader){
    showLoader(()=>{
      window.location.href = page;
    });
  } else {
    window.location.href = page;
  }
}
</script>

</body>
</html>
