<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="mm-a11y.css">
<script>
window.MM_A11Y_ICON_SRC = "PropChkn2.png";
</script>
<script src="mm-a11y.js"></script>

<script src="nav.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Rewards</title>

<link rel="stylesheet" href="app.css">
<script src="app.js"></script>

<style>
:root{
  --blue:#6f9faa;
  --bg:#f6f7f8;
  --red:#c33a2c;
  --text:#111;
  --muted:#6f6f6f;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
}

/* HEADER */
.header{
  background:var(--blue);
  color:#fff;
  padding:20px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-title{
  font-size:20px;
  font-weight:800;
  letter-spacing:.5px;
}

.header img{
  width:50px;
}

/* TABS */
.tabs{
  display:flex;
  border-bottom:1px solid #eee;
  background:#fff;
}

.tab{
  flex:1;
  text-align:center;
  padding:16px;
  font-weight:600;
  color:#999;
  cursor:pointer;
  transition:.2s;
}

.tab.active{
  color:var(--blue);
  border-bottom:3px solid var(--blue);
}

/* MAIN */
.main{
  padding:20px;
  padding-bottom:120px;
}

/* EMPTY */
.empty{
  text-align:center;
  margin-top:40px;
  color:var(--muted);
}

.empty h2{
  margin-bottom:10px;
  font-size:22px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  margin-top:20px;
}

.card-top{
  background:linear-gradient(135deg, #6f9faa, #4f7f89);
  color:#fff;
  padding:24px;
  text-align:center;
  font-weight:800;
  font-size:20px;
}

.card-body{
  padding:20px;
}

.title{
  font-size:22px;
  font-weight:700;
}

.desc{
  margin:10px 0 16px;
  color:#333;
  line-height:1.4;
}

/* CTA */
.cta{
  padding:16px;
  border-radius:999px;
  text-align:center;
  font-weight:700;
  margin-bottom:10px;
  cursor:pointer;
}

.cta.primary{
  background:var(--red);
  color:#fff;
}

.cta.secondary{
  border:2px solid var(--red);
  color:var(--red);
}

/* LOCKED */
.locked{
  opacity:.45;
  filter:grayscale(1);
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:80px;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  color:#888;
}

.nav-item.active{
  color:var(--blue);
  font-weight:600;
}

.nav-img{
  width:26px;
  height:26px;
  object-fit:contain;
  margin-bottom:4px;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-title">MY REWARDS</div>
  <img src="PropChkn2.png">
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="showTab('rewards', this)">Rewards</div>
  <div class="tab" onclick="showTab('offers', this)">Offers</div>
</div>

<div class="main">

  <!-- REWARDS -->
  <div id="rewardsTab">

    <div class="empty">
      <h2>No rewards yet</h2>
      <p>Earn points to unlock rewards</p>
    </div>

    <!-- ACTIVE REWARD -->
    <div class="card">
      <div class="card-top">$3 REWARD READY</div>
      <div class="card-body">
        <div class="title">$3 Sign-Up Reward</div>
        <div class="desc">
          Your first reward is ready to redeem.
        </div>

        <div class="cta primary" data-link="redeem-store.html">
          REDEEM IN-STORE
        </div>

        <div class="cta secondary" data-link="redeem-online.html">
          REDEEM ONLINE
        </div>
      </div>
    </div>

    <!-- LOCKED -->
    <div class="card locked">
      <div class="card-top">75 POINTS</div>
      <div class="card-body">
        <div class="title">Free Sandwich</div>
        <div class="desc">
          Unlock at 75 points.
        </div>
      </div>
    </div>

  </div>

  <!-- OFFERS -->
  <div id="offersTab" style="display:none;">

    <div class="card">
      <div class="card-top">LIMITED OFFER</div>
      <div class="card-body">
        <div class="title">Free Fries</div>
        <div class="desc">
          With any sandwich purchase.
        </div>

        <div class="cta primary">
          ADD TO ACCOUNT
        </div>
      </div>
    </div>

  </div>

</div>

<script>
function showTab(tab, el){
  document.getElementById('rewardsTab').style.display =
    tab === 'rewards' ? 'block' : 'none';

  document.getElementById('offersTab').style.display =
    tab === 'offers' ? 'block' : 'none';

  document.querySelectorAll('.tab')
    .forEach(t=>t.classList.remove('active'));

  el.classList.add('active');
}
</script>

</body>
</html>
