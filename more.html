<!DOCTYPE html>
<html lang="en">
<head>
<script src="nav.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>More</title>

<link rel="stylesheet" href="app.css">
<script src="app.js"></script>

<style>
:root{
  --blue:#6f9faa;
  --bg:#f6f7f8;
  --text:#111;
  --muted:#777;
  --red:#cf3e3e;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
}

/* HEADER */
.header{
  background:var(--blue);
  color:#fff;
  padding:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-title{
  font-size:22px;
  font-weight:800;
}

.header img{
  width:50px;
}

/* LIST */
.section{
  margin-top:16px;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

.item{
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
  font-size:16px;
  cursor:pointer;
}

.item:last-child{
  border-bottom:none;
}

.arrow{
  font-size:18px;
  color:#aaa;
}

/* SIGN OUT */
.signout{
  margin:20px;
  padding:18px;
  text-align:center;
  border-radius:999px;
  border:2px solid var(--red);
  color:var(--red);
  font-weight:700;
  cursor:pointer;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:80px;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.nav-item.active{
  color:var(--blue);
  font-weight:600;
}

.icon{
  font-size:20px;
  margin-bottom:4px;
}

.nav-img{
  width:26px;
  height:26px;
  object-fit:contain;
  margin-bottom:4px;
}

</style>
</head>

<body>

<div class="header">
  <div class="header-title">More</div>
  <img src="PropChkn2.png">
</div>

<div style="padding:16px; padding-bottom:120px;">

  <div class="section">
    <div class="item" data-no-loader>
      Account
      <div class="arrow">›</div>
    </div>

    <div class="item" data-no-loader>
      Rewards
      <div class="arrow">›</div>
    </div>

    <div class="item" data-no-loader>
      Orders
      <div class="arrow">›</div>
    </div>
  </div>

  <div class="section">
    <div class="item" data-no-loader>
      Locations
      <div class="arrow">›</div>
    </div>

    <div class="item" data-no-loader>
      Gift Cards
      <div class="arrow">›</div>
    </div>

    <div class="item" data-no-loader>
      Payment Methods
      <div class="arrow">›</div>
    </div>
  </div>

  <div class="section">
    <div class="item" data-no-loader>
      Help & Support
      <div class="arrow">›</div>
    </div>

    <div class="item" data-no-loader>
      Terms & Conditions
      <div class="arrow">›</div>
    </div>
  </div>

  <div class="signout" data-no-loader>
    Sign Out
  </div>

</div>


</body>
</html>
