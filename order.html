<!DOCTYPE html>
<html lang="en">
<head>
<script src="nav.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order</title>

<link rel="stylesheet" href="app.css">
<script src="app.js"></script>

<style>
:root{
  --blue:#6f9faa;
  --bg:#f6f7f8;
  --text:#111;
}

html, body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
}

/* HEADER */
.header{
  background:var(--blue);
  padding:20px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fff;
}

.header-title{
  font-size:20px;
  font-weight:700;
}

.header img{
  width:54px;
}

/* CONTENT */
.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:calc(100vh - 160px);
  text-align:center;
  padding:20px;
}

.center img{
  width:120px;
  margin-bottom:20px;
}

.center h2{
  margin:0 0 10px;
}

.center p{
  color:#666;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:80px;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.nav-item.active{
  color:var(--blue);
  font-weight:600;
}

.icon{
  font-size:20px;
  margin-bottom:4px;
}

.nav-img{
  width:26px;
  height:26px;
  object-fit:contain;
  margin-bottom:4px;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-title">ORDER</div>
  <img src="PropChkn2.png">
</div>

<div class="center">
  <img src="PropChkn.png">
  <h2>Opening Ordering...</h2>
  <p>Please wait</p>
</div>

<script>
// redirect after short delay so loader shows
setTimeout(()=>{
  window.location.href = "https://order.propositionchicken.com/";
}, 900);
</script>

</body>
</html>
