<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="mm-a11y.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order</title>

<link rel="stylesheet" href="app.css">
<script src="app.js"></script>
<script src="nav.js"></script>

<style>
:root{
  --blue:#6f9faa;
  --bg:#f6f7f8;
  --chicken-red:#cf3e3e;
}

html, body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  overflow:hidden;
}

/* HEADER */
.header{
  background:var(--blue);
  padding:20px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fff;
}

.header-title{
  font-size:20px;
  font-weight:700;
}

.header img{
  width:54px;
}

/* CENTER */
.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:calc(100vh - 160px);
  text-align:center;
  padding:20px;
}

.center img{
  width:120px;
  margin-bottom:20px;
}

.center h2{
  margin:0 0 10px;
}

.center p{
  color:#666;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:80px;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  color:#888;
}

.nav-item.active{
  color:var(--blue);
  font-weight:600;
}

.nav-img{
  width:26px;
  height:26px;
  object-fit:contain;
  margin-bottom:4px;
}

/* 🔴 CURVED WIPE */
.wipe{
  position:fixed;
  bottom:-100%;
  left:0;
  width:100%;
  height:120%;
  background:var(--chicken-red);
  z-index:9999;
  border-top-left-radius:60% 25%;
  border-top-right-radius:60% 25%;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:bottom .7s cubic-bezier(.77,0,.18,1);
}

/* ACTIVE STATE */
.wipe.active{
  bottom:0;
}

/* LOGO INSIDE WIPE */
.wipe-logo{
  width:120px;
  opacity:0;
  transform:scale(.6);
  transition:all .4s ease .2s;
  filter: brightness(0) invert(1);
}

.wipe.active .wipe-logo{
  opacity:1;
  transform:scale(1);
}

.wipe-pattern{
  position:absolute;
  inset:0;

  background-image:url("PropChkn2.png");
  background-size:40px;
  background-repeat:repeat;

  opacity:0;
  transform:scale(.8);
  filter: brightness(0) invert(1);

  transition:all .4s ease .2s;
}

/* animate in with wipe */
.wipe.active .wipe-pattern{
  opacity:.5;
  transform:scale(1);
}

.wipe.active .wipe-pattern{
  opacity:.5;
  transform:scale(1) translateY(-10px);
}
</style>
</head>

<body>

<div class="header">
  <div class="header-title">ORDER</div>
  <img src="PropChkn2.png">
</div>

<div class="center">
  <img src="PropChkn.png">
  <h2>Opening Ordering...</h2>
  <p>Please wait</p>
</div>

<div class="nav">
  <div class="nav-item" data-link="locations.html">
    <img src="icon-location.png" class="nav-img">
    Locations
  </div>

  <div class="nav-item active">
    <img src="icon-order.png" class="nav-img">
    Order
  </div>

  <div class="nav-item" data-link="rewards.html">
    <img src="icon-rewards.png" class="nav-img">
    Rewards
  </div>

  <div class="nav-item" data-link="gift-cards.html">
    <img src="icon-gift.png" class="nav-img">
    Gift Cards
  </div>

  <div class="nav-item" data-link="more.html">
    <img src="icon-more.png" class="nav-img">
    More
  </div>
</div>

<!-- 🔴 WIPE -->
<div class="wipe" id="wipe">
  <div class="wipe-pattern"></div>
</div>

<script>
setTimeout(function(){
  const wipe = document.getElementById('wipe');
  wipe.classList.add('active');

  setTimeout(function(){
    showLoader(function(){
      window.location.href = "https://order.propositionchicken.com/";
    }, 800);
  }, 750);

}, 500);
</script>

</body>
</html>
