<!-- gift-checkout.html — FULL FILE (PATCHED: FIX BUTTON + INPUT WIDTH ONLY) -->
<!DOCTYPE html>
<html lang="en">
<head>
<script src="nav.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Card Checkout</title>

<link rel="stylesheet" href="app.css">
<script src="app.js"></script>

<style>
:root{
  --blue:#6f9faa;
  --bg:#f2f2f2;
  --red:#cf3e3e;
  --text:#111;
  --muted:#777;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
}

.header{
  background:var(--blue);
  color:#fff;
  padding:20px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-title{font-size:20px;font-weight:800;}
.header img{width:50px;}

.main{
  padding:20px;
  padding-bottom:120px;
}

/* FIX: prevent overflow */
.section{
  margin-top:20px;
  width:100%;
}

.input{
  width:100%;
  max-width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:16px;
  display:block;
  box-sizing:border-box;
}

/* GRID */
.card-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.card-option{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  border:3px solid transparent;
  cursor:pointer;
}

.card-option.active{
  border:3px solid var(--red);
}

.card-option img{
  width:100%;
  height:140px;
  object-fit:contain;
  background:#fff;
  padding:6px;
}

.summary{
  margin-top:20px;
  background:#fff;
  padding:18px;
  border-radius:16px;
  font-weight:700;
}

.footer{margin:30px 20px 120px;}

.cta{
  background:var(--red);
  color:#fff;
  padding:20px;
  border-radius:999px;
  text-align:center;
  font-weight:800;
  cursor:pointer;
}

/* POPUP */
.confirm{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.5);
  z-index:99999; /* 🔴 force above loader */
}

.confirm-box{
  background:#fff;
  padding:24px;
  border-radius:16px;
  text-align:center;
  width:80%;
  max-width:300px;
}

.confirm-box img{
  width:70px;
  margin-bottom:10px;
}

.confirm-title{
  font-size:18px;
  font-weight:700;
}

.confirm-text{
  font-size:14px;
  color:var(--muted);
  margin-top:6px;
}

.confirm-btn{
  margin-top:16px;
  background:var(--red);
  color:#fff;
  padding:12px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:80px;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.nav-item.active{color:var(--blue);font-weight:600;}
.icon{font-size:20px;margin-bottom:4px;}

.nav-img{
  width:26px;
  height:26px;
  object-fit:contain;
  margin-bottom:4px;
}

</style>
</head>

<body>

<div class="header">
  <div class="header-title">SEND GIFT CARD</div>
  <img src="PropChkn2.png">
</div>

<div class="main">

  <div class="label">Choose a Card</div>

  <div class="card-grid">
    <div class="card-option active" onclick="selectCard(this)">
      <img src="PropChkn1.png">
    </div>

    <div class="card-option" onclick="selectCard(this)">
      <img src="PropChkn3.png">
    </div>

    <div class="card-option" onclick="selectCard(this)">
      <img src="PropChkn.png">
    </div>

    <div class="card-option" onclick="selectCard(this)">
      <img src="GiftCard.png">
    </div>
  </div>

  <div class="section">
    <div class="label">Send To</div>
    <input id="email" class="input" placeholder="Enter email address">
  </div>

  <div class="summary">
    Amount: <span id="amountDisplay">$10</span>
  </div>

  <div class="footer">
    <!-- FIX: stop global loader + force popup -->
    <div class="cta" onclick="sendGiftCard()">SEND GIFT CARD</div>
  </div>

</div>

<div id="confirmPopup" class="confirm">
  <div class="confirm-box">
    <img src="PropChkn1.png">
    <div class="confirm-title">Gift Card Sent</div>
    <div class="confirm-text">Your gift card has been delivered successfully</div>
    <div class="confirm-btn" onclick="closeConfirm()">Done</div>
  </div>
</div>

<script>
document.getElementById('amountDisplay').innerText = localStorage.getItem('giftAmount') || '$10';

function selectCard(el){
  document.querySelectorAll('.card-option').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
}

function sendGiftCard(){
  const popup = document.getElementById('confirmPopup');

  // 🔴 FORCE VISIBILITY HARD
  popup.style.display = 'flex';
  popup.style.opacity = '1';
  popup.style.zIndex = '99999';

  // 🔴 DEBUG: remove this after confirming
  console.log('POPUP TRIGGERED');
}

function closeConfirm(){
  document.getElementById('confirmPopup').style.display='none';
}
</script>

</body>
</html>
