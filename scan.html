<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="mm-a11y.css">
<script>
window.MM_A11Y_ICON_SRC = "PropChkn2.png";
</script>
<script src="mm-a11y.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan In-Store</title>

<link rel="stylesheet" href="app.css">
<script src="app.js"></script>
<script src="nav.js"></script>

<style>
:root{
  --blue:#6f9faa;
  --bg:#f6f7f8;
  --text:#111;
  --muted:#777;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* HEADER */
.header{
  background:var(--blue);
  color:#fff;
  padding:18px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-title{
  font-size:18px;
  font-weight:700;
  letter-spacing:.5px;
}

.header img{
  width:50px;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* QR CONTAINER */
.qr-box{
  background:#fff;
  padding:24px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
  position:relative;
}

/* SCAN FRAME */
.scan-frame{
  position:absolute;
  inset:0;
  border-radius:20px;
  pointer-events:none;
}

.scan-line{
  position:absolute;
  left:0;
  right:0;
  height:3px;
  background:var(--blue);
  animation:scan 2.2s linear infinite;
}

@keyframes scan{
  0%{top:10%;}
  50%{top:85%;}
  100%{top:10%;}
}

/* TEXT */
.title{
  margin-top:30px;
  font-size:20px;
  font-weight:700;
}

.sub{
  margin-top:10px;
  color:var(--muted);
  text-align:center;
  max-width:260px;
}

/* NAV */
.nav{
  height:80px;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.nav-item.active{
  color:var(--blue);
  font-weight:600;
}

.nav-img{
  width:26px;
  height:26px;
  object-fit:contain;
  margin-bottom:4px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">SCAN IN-STORE</div>
  <img src="PropChkn2.png" alt="Proposition Chicken">
</div>

<!-- MAIN -->
<div class="main">

  <div class="qr-box">
    <canvas id="qr"></canvas>
    <div class="scan-frame">
      <div class="scan-line"></div>
    </div>
  </div>

  <div class="title">Scan at Register</div>
  <div class="sub">
    Hold your phone under the scanner to earn points and redeem rewards
  </div>

</div>

<!-- NAV (GLOBAL LOADER READY) -->
<div class="nav">

  <div class="nav-item" data-link="locations.html">
    <img src="icon-location.png" class="nav-img">
    Locations
  </div>

  <div class="nav-item" data-link="order.html">
    <img src="icon-order.png" class="nav-img">
    Order
  </div>

  <div class="nav-item" data-link="rewards.html">
    <img src="icon-rewards.png" class="nav-img">
    Rewards
  </div>

  <div class="nav-item" data-link="gift-cards.html">
    <img src="icon-gift.png" class="nav-img">
    Gift Cards
  </div>

  <div class="nav-item" data-link="more.html">
    <img src="icon-more.png" class="nav-img">
    More
  </div>

</div>

<!-- QR SCRIPT -->
<script>
function drawQR(text){
  const canvas = document.getElementById("qr");
  const ctx = canvas.getContext("2d");

  const size = 220;
  canvas.width = size;
  canvas.height = size;

  const cells = 25;
  const cellSize = size / cells;

  function pseudoRandom(x,y){
    return Math.sin(x*12.9898 + y*78.233 + text.length)*43758.5453 % 1;
  }

  for(let y=0;y<cells;y++){
    for(let x=0;x<cells;x++){
      const val = pseudoRandom(x,y);
      if(val > 0.5){
        ctx.fillRect(x*cellSize,y*cellSize,cellSize,cellSize);
      }
    }
  }

  function finder(x,y){
    ctx.fillRect(x,y,cellSize*7,cellSize*7);
    ctx.clearRect(x+cellSize,y+cellSize,cellSize*5,cellSize*5);
    ctx.fillRect(x+cellSize*2,y+cellSize*2,cellSize*3,cellSize*3);
  }

  finder(0,0);
  finder(size - cellSize*7,0);
  finder(0,size - cellSize*7);
}

drawQR("propchicken_user_12345");
</script>

</body>
</html>
