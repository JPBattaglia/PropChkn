<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="mm-a11y.css">

<script>
window.MM_INDEX_EMBED_WIDGET = true;
window.MM_A11Y_ICON_SRC = "BrainardIconRuby.png";
window.MM_A11Y_CSS_HREF = "mm-a11y.css";
</script>

<meta property="og:title" content="Proposition Chicken">
<meta property="og:description" content="Order ahead, earn rewards, and skip the line.">
<meta property="og:image" content="https://jpbattaglia.github.io/PropChkn/og-image.png">
<meta property="og:url" content="https://jpbattaglia.github.io/PropChkn/">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jpbattaglia.github.io/PropChkn/og-image.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposition Chicken</title>

<link rel="stylesheet" href="app.css">
<script src="app.js"></script>

<style>
:root{
  --blue:#6f9faa;
  --spring:cubic-bezier(.22,1,.36,1);
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  z-index:999;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .7s ease, transform .7s ease;
}

#splash.fade{
  opacity:0;
  transform:scale(1.03);
}

.splash-gif{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* APP */
#app{
  width:100%;
  min-height:100vh;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* LOGIN CARD */
.auth{
  width:100%;
  max-width:420px;
  padding:28px;
  box-sizing:border-box;
  position:relative;
}

/* HARD HIDE UNTIL READY */
body.index-page.pre-reveal #mmA11yLauncher,
body.index-page.pre-reveal #mmA11yPanel{
  display:none !important;
}

/* WIDGET EMBEDDED IN LOGIN STACK */
.auth #mmA11yLauncher{
  position:absolute !important;
  z-index:50 !important;
  right:-70px !important;
  bottom:10px !important;
  box-shadow:
    0 0 18px rgba(207,62,62,0.35),
    0 0 28px rgba(0,120,255,0.25);

  opacity:0 !important;
  visibility:hidden !important;
  pointer-events:none !important;
  transform:translateY(80px) scale(.9) !important;
  transition:
    opacity 1s var(--spring),
    transform 1s var(--spring),
    visibility 0s linear 1s !important;
  transition-delay:.65s, .65s, 1.65s !important;
}

body.index-page.show.widget-mounted .auth #mmA11yLauncher{
  opacity:1 !important;
  visibility:visible !important;
  pointer-events:auto !important;
  transform:translateY(0) scale(.95) !important;
}

.auth #mmA11yPanel{
  position:absolute !important;
  z-index:49 !important;
  right:-20px !important;
  bottom:84px !important;
  width:min(420px, calc(100vw - 24px)) !important;
  max-height:min(72vh, 620px) !important;

  opacity:0 !important;
  visibility:hidden !important;
  pointer-events:none !important;
  transform:translateY(10px) scale(.98) !important;
  transition:opacity .25s ease, transform .25s ease, visibility 0s linear .25s !important;
}

body.index-page.show.widget-mounted .auth #mmA11yPanel[aria-hidden="false"]{
  opacity:1 !important;
  visibility:visible !important;
  pointer-events:auto !important;
  transform:translateY(0) scale(1) !important;
}

body.index-page.widget-mounted .auth #mmA11yPanel[aria-hidden="true"]{
  display:none !important;
}

/* ANIMATION */
.stagger{
  opacity:0;
  transform:translateY(80px);
  transition:all 1s var(--spring);
}

body.show .stagger{
  opacity:1;
  transform:translateY(0);
}

.stagger:nth-child(1){transition-delay:.2s;}
.stagger:nth-child(2){transition-delay:.35s;}
.stagger:nth-child(3){transition-delay:.5s;}
.stagger:nth-child(4){transition-delay:.65s;}
.stagger:nth-child(5){transition-delay:.8s;}
.stagger:nth-child(6){transition-delay:1.05s;}

.logo{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  margin-bottom:80px;
}

.logo img{
  width:260px;
  max-width:100%;
  display:block;
  margin:0 auto;
}

.btn{
  width:100%;
  padding:18px;
  border-radius:999px;
  font-weight:700;
  margin-top:16px;
  border:none;
  cursor:pointer;
}

.apple{background:#000;color:#fff;}
.primary{background:#6f9faa;color:#fff;}

.google{
  background:#fff;
  border:1px solid #888;
}

.link{
  text-align:center;
  margin:22px 0 12px;
  text-decoration:underline;
  cursor:pointer;
}

.row{
  display:flex;
  gap:14px;
}

.row .btn{flex:1;}

.terms{
  margin-top:30px;
}

.terms-error{
  color:red;
  display:none;
}

/* MOBILE FIT */
@media (max-width: 640px){
  .auth{
    max-width:100%;
    padding:20px 16px 28px;
  }

  .logo{
    margin-bottom:56px;
  }

  .logo img{
    width:220px;
  }

  .auth #mmA11yLauncher{
    right:8px !important;
    bottom:-4px !important;
  }

  .auth #mmA11yPanel{
    left:8px !important;
    right:8px !important;
    width:auto !important;
    bottom:74px !important;
    max-height:calc(100vh - 140px) !important;
  }
}

@media (max-width: 420px){
  .auth{
    padding:18px 12px 24px;
  }

  .auth #mmA11yLauncher{
    right:4px !important;
    bottom:-6px !important;
  }

  .auth #mmA11yPanel{
    left:4px !important;
    right:4px !important;
    bottom:72px !important;
    max-height:calc(100vh - 128px) !important;
  }
}
</style>
</head>

<body class="index-page pre-reveal">

<div id="splash">
  <img src="PropChknVid.gif" class="splash-gif">
</div>

<div id="app">
  <div class="auth" id="authCard">

    <div class="logo stagger">
      <img src="PropChkn.png">
    </div>

    <button class="btn apple stagger" onclick="go('rewards.html')"> Continue with Apple</button>
    <button class="btn google stagger" onclick="go('rewards.html')">Continue with Google</button>

    <div class="link stagger" onclick="go('rewards.html')">Explore as Guest</div>

    <div class="row stagger">
      <button class="btn primary" onclick="go('rewards.html')">LOG IN</button>
      <button class="btn primary" onclick="go('rewards.html')">SIGN UP</button>
    </div>

    <div class="terms stagger">
      <input type="checkbox" id="agree"> I agree to Terms
      <div id="err" class="terms-error">please check terms</div>
    </div>

  </div>
</div>

<script>
const splash = document.getElementById('splash');
const agree = document.getElementById('agree');
const err = document.getElementById('err');
const authCard = document.getElementById('authCard');

let splashDone = false;

function getLauncher(){
  return document.getElementById('mmA11yLauncher');
}

function getPanel(){
  return document.getElementById('mmA11yPanel');
}

function forceLoadWidget(){
  if (getLauncher() && getPanel()) return;

  window.MenuMadeAccessibilityWidgetLoaded = false;

  const existing =
    document.querySelector('script[data-mm-a11y="1"]') ||
    document.querySelector('script[data-index-widget="1"]');

  if (existing) return;

  const script = document.createElement('script');
  script.src = 'mm-a11y.js';
  script.defer = true;
  script.setAttribute('data-index-widget', '1');
  document.body.appendChild(script);
}

function mountWidgetIntoAuth(){
  const launcher = getLauncher();
  const panel = getPanel();

  if (!launcher || !panel) return false;

  if (launcher.parentElement !== authCard) {
    authCard.appendChild(launcher);
  }

  if (panel.parentElement !== authCard) {
    authCard.appendChild(panel);
  }

  launcher.style.display = '';
  launcher.style.right = '';
  launcher.style.bottom = '';
  launcher.style.opacity = '';
  launcher.style.visibility = '';
  launcher.style.pointerEvents = '';
  launcher.style.transform = '';
  launcher.style.transition = '';
  launcher.style.transitionDelay = '';

  panel.style.display = '';
  panel.style.left = '';
  panel.style.right = '';
  panel.style.bottom = '';
  panel.style.width = '';
  panel.style.maxHeight = '';
  panel.style.opacity = '';
  panel.style.visibility = '';
  panel.style.pointerEvents = '';
  panel.style.transform = '';
  panel.style.transition = '';
  panel.style.transitionDelay = '';

  document.body.classList.add('widget-mounted');
  return true;
}

function beginShowAnimation(){
  document.body.classList.remove('pre-reveal');
  void authCard.offsetWidth;
  document.body.classList.add('show');
}

function startReveal(){
  forceLoadWidget();

  let attempts = 0;

  function loop(){
    if (mountWidgetIntoAuth()) {
      beginShowAnimation();
      return;
    }

    attempts += 1;

    if (attempts === 20 || attempts === 40) {
      forceLoadWidget();
    }

    if (attempts > 160) {
      document.body.classList.remove('pre-reveal');
      document.body.classList.add('show');
      return;
    }

    requestAnimationFrame(loop);
  }

  loop();
}

setTimeout(function(){
  splash.classList.add('fade');

  setTimeout(function(){
    splash.style.display = 'none';
    document.body.style.overflow = 'auto';
    splashDone = true;
    startReveal();
  }, 300);

}, 4000);

function go(page){
  if(!splashDone) return;

  if(!agree.checked){
    err.style.display = 'block';
    return;
  }

  err.style.display = 'none';

  if(window.showLoader){
    showLoader(page, 1200);
  } else {
    location.href = page;
  }
}
</script>

</body>
</html>
