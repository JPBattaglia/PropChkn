<!DOCTYPE html>
<html lang="en">
<head>
<script src="nav.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposition Chicken</title>

<link rel="apple-touch-icon" href="PropChkn.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">

<link rel="stylesheet" href="app.css">
</head>

<body>

<div id="splash">
  <img id="gif" src="PropChkGif.gif" class="splash-gif">
</div>

<div id="app">
  <div class="auth" id="auth">

    <div class="logo stagger">
      <img src="PropChkn.png">
    </div>

    <button class="btn apple stagger" data-link="rewards.html"> Continue with Apple</button>

    <button class="btn google stagger" data-link="rewards.html">
      <svg class="google-icon" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.1 0 5.9 1.1 8.1 3.2l6-6C34.5 2.3 29.6 0 24 0 14.6 0 6.6 5.5 2.7 13.5l7.4 5.7C12 13 17.6 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-2.7-.4-4H24v7.5h12.7c-.3 2-1.7 5-4.7 7l7.3 5.7c4.3-4 6.8-9.9 6.8-16.2z"/>
        <path fill="#FBBC05" d="M10.1 28.2c-.5-1.5-.8-3.1-.8-4.7s.3-3.2.8-4.7l-7.4-5.7C1 17.2 0 20.5 0 24s1 6.8 2.7 9.9l7.4-5.7z"/>
        <path fill="#34A853" d="M24 48c6.6 0 12.1-2.2 16.1-6l-7.3-5.7c-2 1.4-4.7 2.4-8.8 2.4-6.4 0-11.9-3.5-13.9-8.7l-7.4 5.7C6.6 42.5 14.6 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <div class="link stagger" data-link="guest.html">Explore as Guest</div>

    <div class="row stagger">
      <button class="btn primary" data-link="rewards.html">LOG IN</button>
      <button class="btn primary" data-link="rewards.html">SIGN UP</button>
    </div>

    <div class="terms stagger">
      <div style="display:flex; gap:10px;">
        <input type="checkbox" id="agree">
        <label>
          I agree to the 
          <a href="terms.html" target="_blank">Terms & Conditions</a>
        </label>
      </div>

      <div id="termsError" class="terms-error">
        please check terms and conditions first
      </div>
    </div>

  </div>
</div>

<script src="app.js"></script>

<script>
const splash = document.getElementById('splash');
const auth = document.getElementById('auth');
const gif = document.getElementById('gif');
const error = document.getElementById('termsError');
const agree = document.getElementById('agree');

const GIF_DURATION = 5500;

gif.onload = () => {
  setTimeout(()=> splash.classList.add('fade'), GIF_DURATION);
  setTimeout(()=> auth.classList.add('show'), GIF_DURATION + 120);
  setTimeout(()=> splash.style.display='none', GIF_DURATION + 700);
};

setTimeout(()=>{
  splash.classList.add('fade');
  auth.classList.add('show');
  splash.style.display='none';
}, 5500);

/* GLOBAL GUARD FOR TERMS */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-link]');
  if(!el) return;

  if(!agree.checked){
    e.preventDefault();
    error.style.display = 'block';
    return;
  }

  error.style.display = 'none';
});
</script>

<style>
:root{
  --blue:#6f9faa;
  --bg:#ffffff;
  --splash:#ffffff;
  --error:#cf3e3e;
  --spring:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  z-index:999;
  background:var(--splash);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .9s var(--spring), transform .9s var(--spring), filter .6s ease;
}

#splash.fade{
  opacity:0;
  transform:scale(1.04);
  filter:blur(8px);
  pointer-events:none;
}

.splash-gif{
  width:420px;
  max-width:90vw;
  transform:scale(1.05);
}

/* APP */
#app{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff;
}

.auth{
  width:100%;
  max-width:420px;
  padding:28px;
  display:flex;
  flex-direction:column;
}

.stagger{
  opacity:0;
  transform:translateY(80px);
  transition:all 1s var(--spring);
}

.show .stagger{
  opacity:1;
  transform:translateY(0);
}

.stagger:nth-child(1){transition-delay:.2s;}
.stagger:nth-child(2){transition-delay:.35s;}
.stagger:nth-child(3){transition-delay:.5s;}
.stagger:nth-child(4){transition-delay:.65s;}
.stagger:nth-child(5){transition-delay:.8s;}
.stagger:nth-child(6){transition-delay:1.05s;}

.logo{
  text-align:center;
  margin-bottom:100px;
}

.logo img{width:260px;}

.btn{
  width:100%;
  padding:18px;
  border-radius:999px;
  font-weight:700;
  margin-top:16px;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.apple{background:#000;color:#fff;}
.primary{background:var(--blue);color:#fff;}

.google{
  background:#fff;
  color:#000;
  border:1px solid #888;
}

.google-icon{width:18px;height:18px;}

.link{
  text-align:center;
  margin:22px 0 12px;
  text-decoration:underline;
  cursor:pointer;
}

.row{display:flex;gap:14px;}
.row .btn{flex:1;}

.terms{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  gap:6px;
  font-size:15px;
}

.terms-error{
  color:var(--error);
  font-size:13px;
  display:none;
}

.terms a{
  color:var(--blue);
  text-decoration:underline;
}
</style>

</body>
</html>
