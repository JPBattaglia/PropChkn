<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposition Chicken</title>

<link rel="stylesheet" href="app.css">
<script src="app.js"></script>

<style>
:root{
  --blue:#6f9faa;
  --spring:cubic-bezier(.22,1,.36,1);
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  z-index:999;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .7s ease, transform .7s ease;
}

#splash.fade{
  opacity:0;
  transform:scale(1.03);
}

.splash-gif{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* APP (CENTERED) */
#app{
  width:100%;
  min-height:100vh;
  background:#fff;

  display:flex;
  justify-content:center;
  align-items:center;
}

.auth{
  width:100%;
  max-width:420px;
  padding:28px;
}

/* ROLLUP */
.stagger{
  opacity:0;
  transform:translateY(80px);
  transition:all 1s var(--spring);
}

body.show .stagger{
  opacity:1;
  transform:translateY(0);
}

.stagger:nth-child(1){transition-delay:.2s;}
.stagger:nth-child(2){transition-delay:.35s;}
.stagger:nth-child(3){transition-delay:.5s;}
.stagger:nth-child(4){transition-delay:.65s;}
.stagger:nth-child(5){transition-delay:.8s;}
.stagger:nth-child(6){transition-delay:1.05s;}

.logo{
  text-align:center;
  margin-bottom:80px;
}

.logo img{
  width:260px;
}

/* BUTTONS */
.btn{
  width:100%;
  padding:18px;
  border-radius:999px;
  font-weight:700;
  margin-top:16px;
  border:none;
  cursor:pointer;
}

.apple{background:#000;color:#fff;}
.primary{background:#6f9faa;color:#fff;}

.google{
  background:#fff;
  border:1px solid #888;
}

.link{
  text-align:center;
  margin:22px 0 12px;
  text-decoration:underline;
  cursor:pointer;
}

.row{
  display:flex;
  gap:14px;
}

.row .btn{flex:1;}

.terms{
  margin-top:30px;
}

.terms-error{
  color:red;
  display:none;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="PropChknVid.gif" class="splash-gif">
</div>

<!-- APP -->
<div id="app">
  <div class="auth">

    <div class="logo stagger">
      <img src="PropChkn.png">
    </div>

    <button class="btn apple stagger" onclick="go('rewards.html')"> Continue with Apple</button>
    <button class="btn google stagger" onclick="go('rewards.html')">Continue with Google</button>

    <div class="link stagger" onclick="go('guest.html')">Explore as Guest</div>

    <div class="row stagger">
      <button class="btn primary" onclick="go('rewards.html')">LOG IN</button>
      <button class="btn primary" onclick="go('rewards.html')">SIGN UP</button>
    </div>

    <div class="terms stagger">
      <input type="checkbox" id="agree"> I agree to Terms
      <div id="err" class="terms-error">please check terms</div>
    </div>

  </div>
</div>

<script>
const splash = document.getElementById('splash');

let splashDone = false;

/* ⏱ SPLASH */
setTimeout(()=>{
  splash.classList.add('fade');

  setTimeout(()=>{
    splash.style.display='none';
    document.body.style.overflow='auto';
    splashDone = true;

    setTimeout(()=>{
      document.body.classList.add('show');
    }, 120);

  }, 300);

}, 4000);

/* NAV */
function go(page){
  if(!splashDone) return;

  if(!agree.checked){
    err.style.display='block';
    return;
  }

  err.style.display='none';

  if(window.showLoader){
    showLoader(page, 1200);
  } else {
    location.href = page;
  }
}
</script>

</body>
</html>
