<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposition Chicken</title>

<link rel="apple-touch-icon" href="PropChkn.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">

<link rel="stylesheet" href="app.css">
<script src="app.js"></script>

<style>
:root{
  --blue:#6f9faa;
  --bg:#ffffff;
  --splash:#ffffff;
  --error:#cf3e3e;
  --spring:cubic-bezier(.22,1,.36,1);
  --chicken-red:#cf3e3e;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  overflow:hidden; /* locked during splash */
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  z-index:999;
  background:var(--splash);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .9s var(--spring), transform .9s var(--spring), filter .6s ease;
}

#splash.fade{
  opacity:0;
  transform:scale(1.04);
  filter:blur(8px);
  pointer-events:none;
}

.splash-gif{
  width:420px;
  max-width:90vw;
  transform:scale(1.05);
}

/* LOADER */
#loader{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}

#loader.active{
  opacity:1;
  pointer-events:auto;
}

.loader-inner{
  position:relative;
  width:180px;
  height:180px;
  background:var(--blue);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.loader-logo{
  width:110px;
  height:110px;
  object-fit:contain;
  z-index:2;
}

.loader-ring{
  position:absolute;
  inset:-18px;
  border-radius:50%;
  border:6px solid transparent;
  border-top:6px solid var(--chicken-red);
  border-right:6px solid var(--chicken-red);
  animation:spin 1s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* APP */
#app{
  position:relative;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:#fff;
}

/* AUTH */
.auth{
  width:100%;
  max-width:420px;
  padding:28px;
  padding-bottom:60px; /* ensures scroll space */
  display:flex;
  flex-direction:column;
}

.stagger{
  opacity:0;
  transform:translateY(80px);
  transition:all 1s var(--spring);
}

.show .stagger{
  opacity:1;
  transform:translateY(0);
}

.stagger:nth-child(1){transition-delay:.2s;}
.stagger:nth-child(2){transition-delay:.35s;}
.stagger:nth-child(3){transition-delay:.5s;}
.stagger:nth-child(4){transition-delay:.65s;}
.stagger:nth-child(5){transition-delay:.8s;}
.stagger:nth-child(6){transition-delay:1.05s;}

.logo{
  text-align:center;
  margin-bottom:80px;
}

.logo img{width:260px;}

.btn{
  width:100%;
  padding:18px;
  border-radius:999px;
  font-weight:700;
  margin-top:16px;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.apple{background:#000;color:#fff;}
.primary{background:var(--blue);color:#fff;}

.google{
  background:#fff;
  color:#000;
  border:1px solid #888;
}

.google-icon{width:18px;height:18px;}

.link{
  text-align:center;
  margin:22px 0 12px;
  text-decoration:underline;
  cursor:pointer;
}

.row{display:flex;gap:14px;}
.row .btn{flex:1;}

.terms{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  gap:6px;
  font-size:15px;
}

.terms-error{
  color:var(--error);
  font-size:13px;
  display:none;
}

.terms a{
  color:var(--blue);
  text-decoration:underline;
}

.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:var(--error);
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  opacity:0;
  transition:.3s;
}

.toast.show{opacity:1;}
</style>
</head>

<body>

<div id="splash">
  <img id="gif" src="PropChkGif.gif" class="splash-gif">
</div>

<div id="loader">
  <div class="loader-inner">
    <div class="loader-ring"></div>
    <img src="PropChkn1.png" class="loader-logo">
  </div>
</div>

<div id="app">
  <div class="auth" id="auth">

    <div class="logo stagger">
      <img src="PropChkn.png">
    </div>

    <button class="btn apple stagger" onclick="go('rewards.html')"> Continue with Apple</button>

    <button class="btn google stagger" onclick="go('rewards.html')">
      <svg class="google-icon" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.1 0 5.9 1.1 8.1 3.2l6-6C34.5 2.3 29.6 0 24 0 14.6 0 6.6 5.5 2.7 13.5l7.4 5.7C12 13 17.6 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-2.7-.4-4H24v7.5h12.7c-.3 2-1.7 5-4.7 7l7.3 5.7c4.3-4 6.8-9.9 6.8-16.2z"/>
        <path fill="#FBBC05" d="M10.1 28.2c-.5-1.5-.8-3.1-.8-4.7s.3-3.2.8-4.7l-7.4-5.7C1 17.2 0 20.5 0 24s1 6.8 2.7 9.9l7.4-5.7z"/>
        <path fill="#34A853" d="M24 48c6.6 0 12.1-2.2 16.1-6l-7.3-5.7c-2 1.4-4.7 2.4-8.8 2.4-6.4 0-11.9-3.5-13.9-8.7l-7.4 5.7C6.6 42.5 14.6 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <div class="link stagger" onclick="go('guest.html')">Explore as Guest</div>

    <div class="row stagger">
      <button class="btn primary" onclick="go('rewards.html')">LOG IN</button>
      <button class="btn primary" onclick="go('rewards.html')">SIGN UP</button>
    </div>

    <div class="terms stagger">
      <div style="display:flex; gap:10px;">
        <input type="checkbox" id="agree">
        <label>
          I agree to the 
          <a href="terms.html" target="_blank">Terms & Conditions</a>
        </label>
      </div>

      <div id="termsError" class="terms-error">
        please check terms and conditions first
      </div>
    </div>

  </div>
</div>

<script>
const splash = document.getElementById('splash');
const auth = document.getElementById('auth');
const gif = document.getElementById('gif');

const GIF_DURATION = 5500;

gif.onload = () => {
  setTimeout(()=>{
    splash.classList.add('fade');
    auth.classList.add('show');
    splash.style.display='none';

    // ENABLE SCROLL AFTER SPLASH
    document.body.style.overflowY = 'auto';
  }, GIF_DURATION);
};

setTimeout(()=>{
  splash.classList.add('fade');
  auth.classList.add('show');
  splash.style.display='none';

  // ENABLE SCROLL FALLBACK
  document.body.style.overflowY = 'auto';
}, 5500);

function go(page){
  if(!agree.checked){
    document.getElementById('termsError').style.display = 'block';
    return;
  }

  document.getElementById('termsError').style.display = 'none';

  if(window.showLoader){
    showLoader(page, 1200);
  } else {
    window.location.href = page;
  }
}
</script>

</body>
</html>
